name: CI

# Type-check and build every PR and push to main. Cloudflare Workers Builds
# does the actual deploy on push to main; this catches breakage before merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx astro check
      - name: Build
        run: npm run build
        env:
          # Public key (it's rendered into every page); keeps the build warning-free.
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADCeodLr9M_radg-
